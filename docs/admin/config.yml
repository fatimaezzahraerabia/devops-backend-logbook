backend:
  name: github
  repo: fatimaezzahraerabia/devops-backend-logbook
  branch: main
  base_url: https://decap-proxy.fatimaezzahraerabia23.workers.dev
  auth_endpoint: auth

media_folder: "docs/assets/images"
public_folder: "/assets/images"

collections:
  - name: "plan"
    label: "Plan & Roadmap"
    folder: "docs/00-plan"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Contenu (Markdown)", name: "body", widget: "markdown" }

  - name: "journal"
    label: "Journal Hebdomadaire"
    folder: "docs/01-journal"
    create: true
    slug: "{{year}}-w{{week}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Semaine", name: "week", widget: "string" }
      - { label: "Objectif", name: "objective", widget: "text" }
      - { label: "Fait", name: "done", widget: "markdown" }
      - { label: "Bloqué / Cassé", name: "blocked", widget: "markdown" }
      - { label: "Appris", name: "learned", widget: "markdown" }
      - { label: "Prochaine Étape", name: "next", widget: "markdown" }

  - name: "backend"
    label: "Backend Engineering"
    folder: "docs/02-backend"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre du Sujet", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Catégorie", name: "category", widget: "select", options: ["Architecture", "Base de Données", "FastAPI / Python", "Performance", "Sécurité"] }
      - { label: "Résumé", name: "summary", widget: "text" }
      - { label: "Contenu (Markdown)", name: "body", widget: "markdown" }

  - name: "devops"
    label: "DevOps & Infra"
    folder: "docs/03-devops"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre du Sujet", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Technologie", name: "tech", widget: "select", options: ["Docker", "Kubernetes", "CI/CD GitHub Actions", "Terraform", "Monitoring Prometheus/Grafana", "Linux & Réseau"] }
      - { label: "Résumé", name: "summary", widget: "text" }
      - { label: "Contenu (Markdown)", name: "body", widget: "markdown" }

  - name: "projets"
    label: "Fiches Projets"
    folder: "docs/04-projets"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom du Projet", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Statut", name: "status", widget: "select", options: ["En Production", "En Développement", "En Pause"] }
      - { label: "Lien Dépôt GitHub", name: "github_repo", widget: "string", required: false }
      - { label: "Lien Démo Live", name: "live_demo", widget: "string", required: false }
      - { label: "Description & Contexte", name: "description", widget: "text" }
      - { label: "Contenu Détaillé (Markdown)", name: "body", widget: "markdown" }

  - name: "incidents"
    label: "Incidents & Postmortems"
    folder: "docs/05-incidents"
    create: true
    slug: "postmortem-{{slug}}"
    fields:
      - { label: "Titre Incident", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Sévérité", name: "severity", widget: "select", options: ["P1 - Critique", "P2 - Majeur", "P3 - Mineur"] }
      - { label: "Résumé", name: "summary", widget: "text" }
      - { label: "Chronologie", name: "timeline", widget: "markdown" }
      - { label: "Cause Racine", name: "root_cause", widget: "markdown" }
      - { label: "Impact", name: "impact", widget: "text" }
      - { label: "Résolution", name: "resolution", widget: "markdown" }
      - { label: "Actions Préventives", name: "preventive_actions", widget: "markdown" }

  - name: "decisions"
    label: "Décisions d'Architecture (ADR)"
    folder: "docs/06-decisions"
    create: true
    slug: "adr-{{slug}}"
    fields:
      - { label: "Titre ADR", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Statut", name: "status", widget: "select", options: ["Accepté", "Proposé", "Remplacé", "Rejeté"] }
      - { label: "Contexte & Problématique", name: "context", widget: "markdown" }
      - { label: "Décision Prise", name: "decision", widget: "markdown" }
      - { label: "Conséquences & Impacts", name: "consequences", widget: "markdown" }

  - name: "cheatsheets"
    label: "Mémos & Cheatsheets"
    folder: "docs/07-cheatsheets"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre du Mémo", name: "title", widget: "string" }
      - { label: "Outil", name: "tool", widget: "select", options: ["Git", "Docker", "Kubernetes", "Linux & Bash", "SQL & Postgres", "Redis"] }
      - { label: "Contenu des Commandes (Markdown)", name: "body", widget: "markdown" }

  - name: "certifications"
    label: "Certifications"
    folder: "docs/08-certifications"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom de la Certification", name: "title", widget: "string" }
      - { label: "Organisme Emetteur", name: "issuer", widget: "string" }
      - { label: "Date d'Obtention", name: "date", widget: "date" }
      - { label: "Date d'Expiration", name: "expiry", widget: "date", required: false }
      - { label: "Identifiant / Numero de Certificat", name: "credential_id", widget: "string", required: false }
      - { label: "Lien de Verification", name: "verify_url", widget: "string", required: false }
      - { label: "Description", name: "body", widget: "markdown", required: false }

  - name: "formation"
    label: "Formation & Diplomes"
    folder: "docs/09-formation"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Diplome / Formation", name: "title", widget: "string" }
      - { label: "Etablissement", name: "school", widget: "string" }
      - { label: "Ville & Pays", name: "location", widget: "string" }
      - { label: "Annee de Debut", name: "start_year", widget: "string" }
      - { label: "Annee de Fin", name: "end_year", widget: "string" }
      - { label: "Domaine", name: "field", widget: "select", options: ["Informatique", "Genie Logiciel", "Reseaux & Telecoms", "DevOps & Cloud", "Mathematiques", "Autre"] }
      - { label: "Mention / Note", name: "grade", widget: "string", required: false }
      - { label: "Description & Cours Principaux", name: "body", widget: "markdown", required: false }

  - name: "experience"
    label: "Experiences Professionnelles"
    folder: "docs/10-experience"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre du Poste", name: "title", widget: "string" }
      - { label: "Entreprise", name: "company", widget: "string" }
      - { label: "Type", name: "type", widget: "select", options: ["CDI", "CDD", "Stage", "Alternance", "Freelance", "Projet Academique"] }
      - { label: "Ville & Pays", name: "location", widget: "string" }
      - { label: "Date de Debut", name: "start_date", widget: "date" }
      - { label: "Date de Fin", name: "end_date", widget: "date", required: false }
      - { label: "Poste Actuel", name: "current", widget: "boolean", default: false }
      - { label: "Technologies Utilisees", name: "stack", widget: "string" }
      - { label: "Missions & Realisations", name: "body", widget: "markdown" }

