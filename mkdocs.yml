site_name: DevOps & Backend Engineering Logbook
site_description: Carnet de bord d'apprentissage, projets, architecture et incidents DevOps & Backend.
site_author: DevOps Engineer Candidate
site_url: https://username.github.io/devops-backend-logbook/

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

nav:
  - ACCUEIL: index.md
  - 🗺️ PLAN & ROADMAP:
      - Feuille de route (90 Jours): 00-plan/roadmap.md
  - 📓 JOURNAL:
      - 2026 - Semaine 01: 01-journal/2026-w01.md
      - Modèle de note: 01-journal/template.md
  - 🐍 BACKEND:
      - Standards & Architecture: 02-backend/index.md
  - 🐳 DEVOPS & INFRA:
      - Guide & Stack DevOps: 03-devops/index.md
  - 🚀 PROJETS:
      - API Gestion de Tâches (Fil Rouge): 04-projets/api-gestion-taches.md
      - Modèle Fiche Projet: 04-projets/template.md
  - 🚨 INCIDENTS & POSTMORTEMS:
      - Postmortem #001 - Latence DB: 05-incidents/postmortem-001.md
      - Modèle Postmortem: 05-incidents/template.md
  - 💡 DÉCISIONS (ADR):
      - ADR-001 - Choix FastAPI & Postgres: 06-decisions/adr-001-fastapi-vs-flask-django.md
      - ADR-002 - File d'attente ARQ vs Celery: 06-decisions/adr-002-async-queue-arq-vs-celery.md
      - Modèle ADR: 06-decisions/template.md
  - ⚡ CHEATSHEETS:
      - Vue d'ensemble: 07-cheatsheets/index.md
      - Git: 07-cheatsheets/git.md
      - Docker: 07-cheatsheets/docker.md
      - Kubernetes: 07-cheatsheets/k8s.md
      - Linux & Bash: 07-cheatsheets/linux.md
      - SQL & Postgres: 07-cheatsheets/sql.md
      - Redis: 07-cheatsheets/redis.md
