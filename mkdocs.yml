site_name: DevOps & Backend Engineering Logbook
site_description: Carnet de bord d'apprentissage, projets, architecture et incidents DevOps & Backend.
site_author: Fatima-Ezzahrae Rabia
site_url: https://fatimaezzahraerabia.github.io/devops-backend-logbook/

repo_url: https://github.com/fatimaezzahraerabia/devops-backend-logbook
repo_name: devops-backend-logbook
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - awesome-pages

hooks:
  - hooks/dynamic_profile.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fatimaezzahraerabia
      name: Profil GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/fatima-ezzahrae-rabia
      name: Profil LinkedIn


